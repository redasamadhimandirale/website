# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# GitHub: set repo to your fork if different. For OAuth on GitHub Pages, see docs/SVELTIA-CMS.md
backend:
  name: github
  repo: redasamadhimandirale/WebsiteSourceCode
  branch: release
  base_url: https://oauth.redasamadhimandirale.workers.dev
site_url: https://redasamadhimandirale.github.io/website/
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: news
    label: घडामोडी व घोषणा
    label_singular: घडामोडी
    icon: newspaper
    folder: src/content/news
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    extension: md
    format: frontmatter
    fields:
      - name: title
        label: शीर्षक
        widget: text
        collapsed: true
      - name: date
        label: दिनांक
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
      - name: isEmbed
        label: फक्त सोशल मीडिया लिंक (Embed) आहे का?
        widget: select
        options:
          - 'yes'
          - 'no'
        default: 'no'
        hint: Turn on to hide manual text fields and provide an embed URL.
      - name: embedCode
        label: सोशल मीडिया एम्बेड कोड (Embed HTML)
        widget: text
        required: false
        hint: Paste the full embed HTML code (like <iframe>...) from YouTube, Facebook, or Instagram. (Use only if "isEmbed" is yes)
      - name: excerpt
        label: सारांश
        widget: text
        required: false
        collapsed: true
      - name: draft
        label: मसुदा (वेबसाइटवरून लपवा)
        widget: boolean
        default: false
      - name: showOnHome
        label: मुख्यपृष्ठावर दाखवा (नवीनतम ओळ)
        widget: boolean
        default: true
        hint: Turn off to keep the post on the News page only (still public when not draft).
      - name: coverImage
        label: कव्हर छायाचित्र
        widget: image
        required: false
        choose_url: true
        hint: Upload or pick from Media; optional URL tab for an existing /uploads/… path.
      - name: tags
        label: टॅग्स
        widget: list
        required: false
        field:
          name: tag
          label: टॅग
          widget: string
      - name: body
        label: मुख्य मजकूर (मराठी)
        widget: markdown
        required: false
  - name: galleries
    label: गॅलरी
    label_singular: गॅलरी
    icon: gallery_thumbnail
    folder: src/content/galleries
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    extension: json
    format: json
    fields:
      - name: title
        label: शीर्षक
        widget: string
        collapsed: true
      - name: description
        label: वर्णन
        widget: text
        required: false
        collapsed: true
      - name: coverImage
        label: कव्हर छायाचित्र
        widget: image
        required: false
        choose_url: true
      - name: items
        label: आयटम
        widget: list
        summary: '{{fields.type}} — {{fields.src}}'
        fields:
          - name: type
            label: प्रकार
            widget: select
            options:
              - image
              - video
          - name: src
            label: छायाचित्र (अपलोड) किंवा व्हिडिओ URL
            widget: file
            required: false
            choose_url: true
            hint: For type image, upload or choose a file. For type video, use the URL tab with a YouTube link.
          - name: alt
            label: पर्यायी मजकूर (Alt text)
            widget: string
            required: false
            collapsed: true
          - name: youtubeId
            label: YouTube ID (व्हिडिओसाठी)
            widget: string
            required: false
  - name: site_data
    label: साइट डेटा
    icon: database
    files:
      - name: festivals
        label: उत्सव
        file: src/content/festivals/festivals.json
        fields:
          - name: festivals
            label: उत्सव
            widget: list
            summary: '{{fields.slug}}'
            fields:
              - name: slug
                label: स्लग
                widget: string
              - name: order
                label: क्रम
                widget: number
                value_type: int
              - name: image
                label: पोस्टर छायाचित्र
                widget: image
                required: false
                choose_url: true
              - name: youtubeVideoId
                label: YouTube व्हिडिओ ID
                widget: string
                required: false
              - name: title
                label: शीर्षक
                widget: string
                collapsed: true
              - name: excerpt
                label: सारांश
                widget: text
                collapsed: true
              - name: paragraphs
                label: परिच्छेद
                widget: list
                collapsed: true
      - name: darshan_schedule
        label: दर्शन वेळापत्रक
        file: src/content/darshan/schedule.json
        fields:
          - name: notes
            label: नोंदी
            widget: text
            collapsed: true
          - name: slots
            label: वेळा
            widget: list
            summary: '{{fields.label.mr}}'
            fields:
              - name: label
                label: लेबल
                widget: string
                collapsed: true
              - name: time
                label: वेळ
                widget: string
                collapsed: true
      - name: trustees
        label: विश्वस्त
        file: src/content/trustees/trustees.json
        fields:
          - name: trustees
            label: विश्वस्त
            widget: list
            summary: '{{fields.name}} — {{fields.role}}'
            fields:
              - name: name
                label: नाव (मराठी)
                widget: string
              - name: role
                label: भूमिका (Role key)
                widget: select
                options:
                  - { label: "अध्यक्ष", value: "Chairman" }
                  - { label: "उपाध्यक्ष", value: "Vice Chairman" }
                  - { label: "सचिव", value: "Secretary" }
                  - { label: "कोषाध्यक्ष", value: "Treasurer" }
                  - { label: "विश्वस्त", value: "Trustee" }
                  - { label: "स्विकृत विश्वस्त", value: "Co-opted Trustee" }
                  - { label: "व्यवस्थापक", value: "Manager" }
                hint: Labels on the site come from i18n; this value must match the key.
              - name: image
                label: छायाचित्र
                widget: image
                required: true
                choose_url: true
                hint: Upload saves under public/uploads (e.g. trustees/). URL tab if the file already exists in the repo.
      - name: premises_showcase
        label: परिसर दर्शन
        file: src/content/premises/showcase.json
        fields:
          - name: items
            label: आयटम (क्रम = प्रदर्शन क्रम)
            widget: list
            summary: '{{fields.id}}'
            fields:
              - name: id
                label: विभाग ID (i18n अद्यतनित केल्याशिवाय बदलू नका)
                widget: select
                options:
                  - development
                  - mahadwar
                  - barav
                  - vinamandapEast
                  - vinamandapNorthSouth
                  - vinamandapSoutheast
                  - lighting
                  - interior
                  - garden
              - name: image
                label: छायाचित्र
                widget: image
                required: true
                choose_url: true
      - name: social_links
        label: सामाजिक दुवे
        file: src/content/site/social.json
        fields:
          - name: facebook
            label: Facebook URL
            widget: string
          - name: instagram
            label: Instagram URL
            widget: string
          - name: youtube
            label: YouTube URL
            widget: string
      - name: history_mr
        label: इतिहास (मराठी)
        file: src/content/history/narrative-mr.json
        fields:
          - name: openingVerses
            label: सुरुवातीचे श्लोक
            widget: text
          - name: paragraphs
            label: परिच्छेद
            widget: list
            field:
              name: paragraph
              label: परिच्छेद
              widget: text
      - name: history_en
        label: इतिहास (इंग्रजी)
        file: src/content/history/narrative-en.json
        fields:
          - name: openingVerses
            label: सुरुवातीचे श्लोक
            widget: text
          - name: paragraphs
            label: परिच्छेद
            widget: list
            field:
              name: paragraph
              label: परिच्छेद
              widget: text
      - name: nearby_places
        label: जवळपासची प्रेक्षणीय स्थळे (Nearby Places)
        file: src/content/nearby/places.json
        fields:
          - name: teasers
            label: मुख्यपृष्ठावरील टीझर्स (Home Teasers)
            widget: list
            summary: '{{fields.name.mr}}'
            fields:
              - name: id
                label: ID
                widget: string
              - name: name
                label: नाव
                widget: string
                collapsed: true
              - name: excerpt
                label: सारांश
                widget: text
                collapsed: true
              - name: image
                label: छायाचित्र
                widget: image
                choose_url: true
              - name: hash
                label: हॅश लिंक (उदा.
                widget: string
          - name: categories
            label: वर्ग (Categories)
            widget: list
            summary: '{{fields.title.mr}}'
            fields:
              - name: id
                label: ID
                widget: string
              - name: title
                label: शीर्षक
                widget: string
                collapsed: true
              - name: intro
                label: प्रस्तावना
                widget: text
                required: false
                collapsed: true
              - name: subsections
                label: उपविभाग
                widget: list
                required: false
                summary: '{{fields.title.mr}}'
                fields:
                  - name: id
                    label: ID
                    widget: string
                  - name: title
                    label: शीर्षक
                    widget: string
                    collapsed: true
                  - name: items
                    label: ठिकाणे
                    widget: list
                    summary: '{{fields.name.mr}}'
                    fields:
                      - name: name
                        label: नाव
                        widget: string
                        collapsed: true
                      - name: location
                        label: ठिकाण (कंसात)
                        widget: string
                        required: false
                        collapsed: true
                      - name: image
                        label: छायाचित्र
                        widget: image
                        required: false
                        choose_url: true
              - name: items
                label: ठिकाणे
                widget: list
                required: false
                summary: '{{fields.name.mr}}'
                fields:
                  - name: name
                    label: नाव
                    widget: string
                    collapsed: true
                  - name: location
                    label: ठिकाण (कंसात)
                    widget: string
                    required: false
                    collapsed: true
                  - name: image
                    label: छायाचित्र
                    widget: image
                    required: false
                    choose_url: true
      - name: contact_info
        label: संपर्क माहिती (Contact Info)
        file: src/content/site/contact.json
        fields:
          - name: addressLine1
            label: पत्ता ओळ १ (Address Line 1)
            widget: string
            collapsed: true
          - name: addressLine2
            label: पत्ता ओळ २ (Address Line 2)
            widget: string
            collapsed: true
          - name: phone
            label: फोन नंबर (Phone)
            widget: list
            field:
              name: number
              label: नंबर (Number)
              widget: string
          - name: email
            label: ईमेल (Email)
            widget: string
      - name: donation_info
        label: देणगी माहिती (Donation Info)
        file: src/content/site/donation.json
        fields:
          - name: accountNoValue
            label: खाते क्रमांक (Account No.)
            widget: string
          - name: ifscValue
            label: IFSC कोड (IFSC Code)
            widget: string
          - name: bankValue
            label: बँकेचे नाव (Bank Name)
            widget: string
          - name: branchValue
            label: शाखा (Branch)
            widget: string
          - name: tax80gRegistrationValue
            label: 80G नोंदणी क्रमांक (80G Reg. No.)
            widget: string
          - name: tax80gDatedValue
            label: नोंदणी दिनांक (80G Dated)
            widget: string
          - name: qrImage
            label: UPI QR कोड (UPI QR Code Image)
            widget: image
            choose_url: true
      - name: general_info
        label: सर्वसाधारण माहिती (General Info)
        file: src/content/site/general.json
        fields:
          - name: siteName
            label: साइटचे नाव (Site Name)
            widget: string
            collapsed: true
      - name: footer_info
        label: तळटीप माहिती (Footer Info)
        file: src/content/site/footer.json
        fields:
          - name: copyrightOwner
            label: कॉपीराइट मालक (Copyright Owner)
            widget: string
            collapsed: true
          - name: rightsReservedText
            label: हक्क राखीव मजकूर (Rights Reserved Text)
            widget: string
            collapsed: true
      - name: privacy_policy
        label: गोपनीयता धोरण (Privacy Policy)
        file: src/content/site/privacy.json
        fields:
          - name: meta
            label: मेटा माहिती (Meta Info)
            widget: object
            collapsed: true
            fields:
              - name: title
                label: शीर्षक (Title)
                widget: string
                collapsed: true
              - name: description
                label: वर्णन (Description)
                widget: string
                collapsed: true
          - name: header
            label: हेडर (Header)
            widget: object
            collapsed: true
            fields:
              - name: eyebrow
                label: आयब्रो (Eyebrow)
                widget: string
                collapsed: true
              - name: title
                label: शीर्षक (Title)
                widget: string
                collapsed: true
              - name: subtitle
                label: उपशीर्षक (Subtitle)
                widget: string
                collapsed: true
          - name: updated
            label: अद्यतनित दिनांक (Updated Date Text)
            widget: string
            collapsed: true
          - name: blocks
            label: माहितीचे विभाग (Content Blocks)
            widget: list
            summary: '{{fields.title.mr}}'
            fields:
              - name: title
                label: विभाग शीर्षक (Section Title)
                widget: string
                collapsed: true
              - name: paragraphs
                label: परिच्छेद (Paragraphs)
                widget: list
                collapsed: true
      - name: terms_of_service
        label: सेवा अटी (Terms of Service)
        file: src/content/site/terms.json
        fields:
          - name: meta
            label: मेटा माहिती (Meta Info)
            widget: object
            collapsed: true
            fields:
              - name: title
                label: शीर्षक (Title)
                widget: string
                collapsed: true
              - name: description
                label: वर्णन (Description)
                widget: string
                collapsed: true
          - name: header
            label: हेडर (Header)
            widget: object
            collapsed: true
            fields:
              - name: eyebrow
                label: आयब्रो (Eyebrow)
                widget: string
                collapsed: true
              - name: title
                label: शीर्षक (Title)
                widget: string
                collapsed: true
              - name: subtitle
                label: उपशीर्षक (Subtitle)
                widget: string
                collapsed: true
          - name: updated
            label: अद्यतनित दिनांक (Updated Date Text)
            widget: string
            collapsed: true
          - name: blocks
            label: माहितीचे विभाग (Content Blocks)
            widget: list
            summary: '{{fields.title.mr}}'
            fields:
              - name: title
                label: विभाग शीर्षक (Section Title)
                widget: string
                collapsed: true
              - name: paragraphs
                label: परिच्छेद (Paragraphs)
                widget: list
                collapsed: true
