# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# GitHub: set repo to your fork if different. For OAuth on GitHub Pages, see docs/SVELTIA-CMS.md
backend:
  name: github
  repo: redasamadhimandirale/website
  branch: main
  # base_url: https://oauth.redasamadhimandirale.workers.dev
  # Note: Sveltia CMS provides a free, public authentication server by default if base_url is omitted.
  # If you use your own worker, it must allow http://localhost:4321 as an allowed origin for local development.

site_url: https://redasamadhimandirale.github.io/website/

media_folder: public/uploads
public_folder: /uploads

#  locale: en

collections:
  - name: news
    label: घडामोडी व घोषणा
    label_singular: घडामोडी
    icon: newspaper
    folder: src/content/news
    create: true
    slug: '{{slug}}'
    summary: '{{title.mr}}'
    extension: md
    format: frontmatter
    fields:
      - name: title
        label: शीर्षक
        widget: object
        collapsed: true
        fields:
          - { name: mr, label: मराठी, widget: text }
          - { name: en, label: इंग्रजी, widget: string }
      - { name: date, label: दिनांक, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - name: isEmbed
        label: फक्त सोशल मीडिया लिंक (Embed) आहे का?
        widget: select
        options: [yes, no]
        default: no
        hint: Turn on to hide manual text fields and provide an embed URL.
      - name: embedCode
        label: सोशल मीडिया एम्बेड कोड (Embed HTML)
        widget: text
        required: false
        condition:
          field: isEmbed
          pattern: "yes"
        hint: 'Paste the full embed HTML code (like <iframe>...) from YouTube, Facebook, or Instagram.'
      - name: excerpt
        label: सारांश
        widget: object
        required: false
        collapsed: true
        condition:
          field: isEmbed
          pattern: "no"
        fields:
          - { name: mr, label: मराठी, widget: text }
          - { name: en, label: इंग्रजी, widget: text }
      - { name: draft, label: मसुदा (वेबसाइटवरून लपवा), widget: boolean, default: false }
      - {
          name: showOnHome,
          label: मुख्यपृष्ठावर दाखवा (नवीनतम ओळ),
          widget: boolean,
          default: true,
          hint: 'Turn off to keep the post on the News page only (still public when not draft).',
        }
      - name: coverImage
        label: कव्हर छायाचित्र
        widget: image
        required: false
        choose_url: true
        hint: Upload or pick from Media; optional URL tab for an existing /uploads/… path.
        condition:
          field: isEmbed
          pattern: "no"
      - name: tags
        label: टॅग्स
        widget: list
        required: false
        condition:
          field: isEmbed
          pattern: "no"
        field:
          label: टॅग
          widget: string
      - name: body_mr
        label: मुख्य मजकूर (मराठी)
        widget: markdown
        required: false
        condition:
          field: isEmbed
          pattern: "no"
      - name: body_en
        label: मुख्य मजकूर (इंग्रजी)
        widget: markdown
        required: false
        condition:
          field: isEmbed
          pattern: "no"
  - name: galleries
    label: गॅलरी
    label_singular: गॅलरी
    icon: gallery_thumbnail
    folder: src/content/galleries
    create: true
    slug: '{{slug}}'
    summary: '{{title.mr}}'
    extension: json
    format: json
    fields:
      - name: title
        label: शीर्षक
        widget: object
        collapsed: true
        fields:
          - { name: mr, label: मराठी, widget: string }
          - { name: en, label: इंग्रजी, widget: string }
      - name: description
        label: वर्णन
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: mr, label: मराठी, widget: text }
          - { name: en, label: इंग्रजी, widget: text }
      - name: coverImage
        label: कव्हर छायाचित्र
        widget: image
        required: false
        choose_url: true
      - name: items
        label: आयटम
        widget: list
        summary: '{{fields.type}} — {{fields.src}}'
        fields:
          - name: type
            label: प्रकार
            widget: select
            options: [image, video]
          - name: src
            label: छायाचित्र (अपलोड) किंवा व्हिडिओ URL
            widget: file
            required: false
            choose_url: true
            hint: For type image, upload or choose a file. For type video, use the URL tab with a YouTube link.
          - name: alt
            label: पर्यायी मजकूर (Alt text)
            widget: object
            required: false
            collapsed: true
            fields:
              - { name: mr, label: मराठी, widget: string }
              - { name: en, label: इंग्रजी, widget: string }
          - { name: youtubeId, label: YouTube ID (व्हिडिओसाठी), widget: string, required: false }

  - name: site_data
    label: साइट डेटा
    icon: database
    files:
      - name: festivals
        label: उत्सव
        file: src/content/festivals/festivals.json
        fields:
          - name: festivals
            label: उत्सव
            widget: list
            summary: '{{fields.slug}}'
            fields:
              - { name: slug, label: स्लग, widget: string }
              - { name: order, label: क्रम, widget: number, value_type: int }
              - name: image
                label: पोस्टर छायाचित्र
                widget: image
                required: false
                choose_url: true
              - { name: youtubeVideoId, label: YouTube व्हिडिओ ID, widget: string, required: false }
              - name: title
                label: शीर्षक
                widget: object
                collapsed: true
                fields:
                  - { name: mr, label: मराठी, widget: string }
                  - { name: en, label: इंग्रजी, widget: string }
              - name: excerpt
                label: सारांश
                widget: object
                collapsed: true
                fields:
                  - { name: mr, label: मराठी, widget: text }
                  - { name: en, label: इंग्रजी, widget: text }
              - name: paragraphs
                label: परिच्छेद
                widget: object
                collapsed: true
                fields:
                  - name: mr
                    label: मराठी परिच्छेद
                    widget: list
                    field: { label: परिच्छेद, widget: text }
                  - name: en
                    label: इंग्रजी परिच्छेद
                    widget: list
                    field: { label: परिच्छेद, widget: text }

      - name: darshan_schedule
        label: दर्शन वेळापत्रक
        file: src/content/darshan/schedule.json
        fields:
          - name: notes
            label: नोंदी
            widget: object
            collapsed: true
            fields:
              - { name: mr, label: मराठी, widget: text }
              - { name: en, label: इंग्रजी, widget: text }
          - name: slots
            label: वेळा
            widget: list
            summary: '{{fields.label.mr}}'
            fields:
              - name: label
                label: लेबल
                widget: object
                collapsed: true
                fields:
                  - { name: mr, label: मराठी, widget: string }
                  - { name: en, label: इंग्रजी, widget: string }
              - name: time
                label: वेळ
                widget: object
                collapsed: true
                fields:
                  - { name: mr, label: मराठी, widget: string }
                  - { name: en, label: इंग्रजी, widget: string }

      - name: trustees
        label: विश्वस्त
        file: src/content/trustees/trustees.json
        fields:
          - name: trustees
            label: विश्वस्त
            widget: list
            summary: '{{fields.name-en}} — {{fields.role}}'
            fields:
              - { name: name-en, label: नाव (इंग्रजी), widget: string }
              - { name: name-mr, label: नाव (मराठी), widget: string }
              - name: role
                label: भूमिका (Role key)
                widget: select
                options:
                  - Chairman
                  - Vice Chairman
                  - Secretary
                  - Treasurer
                  - Trustee
                hint: Labels on the site come from i18n; this value must match the key.
              - name: image
                label: छायाचित्र
                widget: image
                required: true
                choose_url: true
                hint: Upload saves under public/uploads (e.g. trustees/). URL tab if the file already exists in the repo.

      - name: premises_showcase
        label: परिसर दर्शन
        file: src/content/premises/showcase.json
        fields:
          - name: items
            label: आयटम (क्रम = प्रदर्शन क्रम)
            widget: list
            summary: '{{fields.id}}'
            fields:
              - name: id
                label: विभाग ID (i18n अद्यतनित केल्याशिवाय बदलू नका)
                widget: select
                options:
                  - development
                  - mahadwar
                  - barav
                  - vinamandapEast
                  - vinamandapNorthSouth
                  - vinamandapSoutheast
                  - lighting
                  - interior
                  - garden
              - name: image
                label: छायाचित्र
                widget: image
                required: true
                choose_url: true

      - name: social_links
        label: सामाजिक दुवे
        file: src/content/site/social.json
        fields:
          - { name: facebook, label: Facebook URL, widget: string }
          - { name: instagram, label: Instagram URL, widget: string }
          - { name: youtube, label: YouTube URL, widget: string }

      - name: history_mr
        label: इतिहास (मराठी)
        file: src/content/history/narrative-mr.json
        fields:
          - { name: openingVerses, label: सुरुवातीचे श्लोक, widget: text }
          - name: paragraphs
            label: परिच्छेद
            widget: list
            field: { label: परिच्छेद, widget: text }

      - name: history_en
        label: इतिहास (इंग्रजी)
        file: src/content/history/narrative-en.json
        fields:
          - { name: openingVerses, label: सुरुवातीचे श्लोक, widget: text }
          - name: paragraphs
            label: परिच्छेद
            widget: list
            field: { label: परिच्छेद, widget: text }

      - name: nearby_places
        label: जवळपासची प्रेक्षणीय स्थळे (Nearby Places)
        file: src/content/nearby/places.json
        fields:
          - name: teasers
            label: मुख्यपृष्ठावरील टीझर्स (Home Teasers)
            widget: list
            summary: '{{fields.name.mr}}'
            fields:
              - name: id
                label: ID
                widget: string
              - name: name
                label: नाव
                widget: object
                collapsed: true
                fields:
                  - { name: mr, label: मराठी, widget: string }
                  - { name: en, label: इंग्रजी, widget: string }
              - name: excerpt
                label: सारांश
                widget: object
                collapsed: true
                fields:
                  - { name: mr, label: मराठी, widget: text }
                  - { name: en, label: इंग्रजी, widget: text }
              - name: image
                label: छायाचित्र
                widget: image
                choose_url: true
              - name: hash
                label: हॅश लिंक (उदा. #ashtavinayak)
                widget: string
          - name: categories
            label: वर्ग (Categories)
            widget: list
            summary: '{{fields.title.mr}}'
            fields:
              - name: id
                label: ID
                widget: string
              - name: title
                label: शीर्षक
                widget: object
                collapsed: true
                fields:
                  - { name: mr, label: मराठी, widget: string }
                  - { name: en, label: इंग्रजी, widget: string }
              - name: intro
                label: प्रस्तावना
                widget: object
                required: false
                collapsed: true
                fields:
                  - { name: mr, label: मराठी, widget: text }
                  - { name: en, label: इंग्रजी, widget: text }
              - name: subsections
                label: उपविभाग
                widget: list
                required: false
                summary: '{{fields.title.mr}}'
                fields:
                  - name: id
                    label: ID
                    widget: string
                  - name: title
                    label: शीर्षक
                    widget: object
                    collapsed: true
                    fields:
                      - { name: mr, label: मराठी, widget: string }
                      - { name: en, label: इंग्रजी, widget: string }
                  - name: items
                    label: ठिकाणे
                    widget: list
                    summary: '{{fields.name.mr}}'
                    fields:
                      - name: name
                        label: नाव
                        widget: object
                        collapsed: true
                        fields:
                          - { name: mr, label: मराठी, widget: string }
                          - { name: en, label: इंग्रजी, widget: string }
                      - name: location
                        label: ठिकाण (कंसात)
                        widget: object
                        required: false
                        collapsed: true
                        fields:
                          - { name: mr, label: मराठी, widget: string }
                          - { name: en, label: इंग्रजी, widget: string }
                      - name: image
                        label: छायाचित्र
                        widget: image
                        required: false
                        choose_url: true
              - name: items
                label: ठिकाणे
                widget: list
                required: false
                summary: '{{fields.name.mr}}'
                fields:
                  - name: name
                    label: नाव
                    widget: object
                    collapsed: true
                    fields:
                      - { name: mr, label: मराठी, widget: string }
                      - { name: en, label: इंग्रजी, widget: string }
                  - name: location
                    label: ठिकाण (कंसात)
                    widget: object
                    required: false
                    collapsed: true
                    fields:
                      - { name: mr, label: मराठी, widget: string }
                      - { name: en, label: इंग्रजी, widget: string }
                  - name: image
                    label: छायाचित्र
                    widget: image
                    required: false
                    choose_url: true

      - name: contact_info
        label: संपर्क माहिती (Contact Info)
        file: src/content/site/contact.json
        fields:
          - name: addressLine1
            label: पत्ता ओळ १ (Address Line 1)
            widget: object
            collapsed: true
            fields:
              - { name: mr, label: मराठी, widget: string }
              - { name: en, label: इंग्रजी, widget: string }
          - name: addressLine2
            label: पत्ता ओळ २ (Address Line 2)
            widget: object
            collapsed: true
            fields:
              - { name: mr, label: मराठी, widget: string }
              - { name: en, label: इंग्रजी, widget: string }
          - { name: phone, label: फोन नंबर (Phone), widget: string }
          - { name: email, label: ईमेल (Email), widget: string }

      - name: donation_info
        label: देणगी माहिती (Donation Info)
        file: src/content/site/donation.json
        fields:
          - { name: accountNoValue, label: खाते क्रमांक (Account No.), widget: string }
          - { name: ifscValue, label: IFSC कोड (IFSC Code), widget: string }
          - { name: bankValue, label: बँकेचे नाव (Bank Name), widget: string }
          - { name: branchValue, label: शाखा (Branch), widget: string }
          - { name: tax80gRegistrationValue, label: 80G नोंदणी क्रमांक (80G Reg. No.), widget: string }
          - { name: tax80gDatedValue, label: नोंदणी दिनांक (80G Dated), widget: string }
          - { name: qrImage, label: UPI QR कोड (UPI QR Code Image), widget: image, choose_url: true }
